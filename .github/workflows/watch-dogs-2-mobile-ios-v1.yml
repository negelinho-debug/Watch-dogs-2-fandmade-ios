name: Watch Dogs 2 Mobile iOS - v1.4 NFS Style

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  recover_and_export:
    name: 1. Recover APK, migrate 5.6 -> 2017 -> 2019, export iOS
    runs-on: ubuntu-22.04
    timeout-minutes: 210

    env:
      UNITY_USERNAME: ${{ secrets.UNITY_USERNAME }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      UNITY_EMAIL: ${{ secrets.UNITY_USERNAME }}

      SOURCE_UNITY: "5.6.5f1"
      MIGRATION_UNITY: "2017.4.40f1"
      MIGRATION_CHANGESET: "6e14067f8a9a"
      BUILD_UNITY: "2019.4.40f1"
      BUILD_CHANGESET: "ffc62b691db5"

      WORK: ${{ github.workspace }}/wd2-work
      APK: ${{ github.workspace }}/wd2-work/Watchdogs2Mobile.apk
      APKROOT: ${{ github.workspace }}/wd2-work/apk
      RECOVERED: ${{ github.workspace }}/wd2-work/recovered
      OUTPUT: ${{ github.workspace }}/wd2-output
      XCODE_OUT: ${{ github.workspace }}/wd2-build/iOS/WatchDogs2Mobile-iOS

    outputs:
      xcode_ready: ${{ steps.detect_xcode.outputs.ready }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Prepare folders
        shell: bash
        run: |
          set -euo pipefail

          rm -rf \
            "$WORK" \
            "$OUTPUT" \
            "$GITHUB_WORKSPACE/wd2-build"

          mkdir -p \
            "$WORK" \
            "$APKROOT" \
            "$RECOVERED" \
            "$OUTPUT" \
            "$GITHUB_WORKSPACE/wd2-build/iOS"

      - name: Install Linux runtime dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update -o Acquire::Retries=4

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            ca-certificates \
            curl \
            gnupg \
            unzip \
            xz-utils \
            zip \
            xvfb \
            libgconf-2-4 \
            libgtk2.0-0 \
            libgtk-3-0 \
            libnss3 \
            libasound2 \
            libglu1-mesa \
            libxss1 \
            libxtst6 \
            libxrandr2 \
            libxcursor1 \
            libxi6 \
            libxinerama1 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libdrm2 \
            libgbm1

      - name: Find Watch Dogs 2 APK automatically
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          FOUND="$(
            find "$GITHUB_WORKSPACE" \
              -type f \
              -iname '*.apk' \
              ! -path "$WORK/*" \
              -printf '%s %p\n' \
              | sort -nr \
              | head -1 \
              | cut -d' ' -f2-
          )"

          if [ -n "${FOUND:-}" ] && [ -f "$FOUND" ]; then
            if head -c 200 "$FOUND" 2>/dev/null | grep -q 'git-lfs.github.com/spec'; then
              git lfs install --local || true
              git lfs pull || true
            fi

            if [ -s "$FOUND" ] && ! head -c 200 "$FOUND" 2>/dev/null | grep -q 'git-lfs.github.com/spec'; then
              cp "$FOUND" "$APK"
            fi
          fi

          if [ ! -s "$APK" ]; then
            mkdir -p "$WORK/release"

            gh release download 0.0.1 \
              --repo "$GITHUB_REPOSITORY" \
              --pattern '*.apk' \
              --dir "$WORK/release"

            CANDIDATE="$(
              find "$WORK/release" \
                -type f \
                -iname '*.apk' \
                -printf '%s %p\n' \
                | sort -nr \
                | head -1 \
                | cut -d' ' -f2-
            )"

            test -n "$CANDIDATE"
            test -s "$CANDIDATE"
            cp "$CANDIDATE" "$APK"
          fi

          test -s "$APK"
          ls -lh "$APK"

      - name: Verify exact Watch Dogs 2 Mobile base
        shell: bash
        run: |
          set -euo pipefail

          unzip -oq "$APK" -d "$APKROOT"

          DATA="$APKROOT/assets/bin/Data"
          ASM="$DATA/Managed/Assembly-CSharp.dll"

          test -s "$DATA/globalgamemanagers"
          test -s "$ASM"

          VERSION="$(
            strings "$DATA/globalgamemanagers" \
              | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+[abfp][0-9]+' \
              | head -1
          )"

          echo "Detected Unity: $VERSION"

          if [ "$VERSION" != "$SOURCE_UNITY" ]; then
            echo "::error::Expected Unity $SOURCE_UNITY, got ${VERSION:-unknown}"
            exit 1
          fi

          if find "$APKROOT" -type f -name 'libil2cpp.so' | grep -q .; then
            echo "::error::This workflow expects the Mono build, not IL2CPP."
            exit 1
          fi

          if ! find "$APKROOT" -type f -name 'libmono.so' | grep -q .; then
            echo "::error::libmono.so not found."
            exit 1
          fi

          {
            echo "APK_SIZE=$(stat -c%s "$APK")"
            echo "UNITY_VERSION=$VERSION"
            echo "ASSEMBLY_CSHARP_SIZE=$(stat -c%s "$ASM")"
            echo "ARCHS:"
            find "$APKROOT/lib" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort
          } | tee "$OUTPUT/apk-summary.txt"

      - name: Extract original APK icon
        shell: bash
        run: |
          set -euo pipefail

          ICON="$(
            find "$APKROOT/res" \
              -type f \
              \( -iname 'app_icon.png' -o -iname '*icon*.png' \) \
              -printf '%s %p\n' \
              | sort -nr \
              | head -1 \
              | cut -d' ' -f2-
          )"

          if [ -z "${ICON:-}" ] || [ ! -s "$ICON" ]; then
            echo "::error::APK icon not found."
            exit 1
          fi

          cp "$ICON" "$OUTPUT/Watch-Dogs-2-Mobile-original-icon.png"
          file "$OUTPUT/Watch-Dogs-2-Mobile-original-icon.png"

      - name: Download AssetRipper 2.0.0
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mkdir -p "$WORK/tools/assetripper"

          gh release download 2.0.0 \
            -R AssetRipper/AssetRipper \
            -p 'AssetRipper_linux_x64.tar.xz' \
            -D "$WORK/tools"

          tar -xJf "$WORK/tools/AssetRipper_linux_x64.tar.xz" \
            -C "$WORK/tools/assetripper"

          RIPPER="$(
            find "$WORK/tools/assetripper" \
              -type f \
              \( -name 'AssetRipper.GUI.Free' -o -name 'AssetRipper.GUI' -o -name 'AssetRipper' \) \
              -print \
              | head -1
          )"

          test -n "$RIPPER"
          chmod +x "$RIPPER"
          echo "RIPPER=$RIPPER" >> "$GITHUB_ENV"

      - name: Recover editable Unity project
        id: recover
        shell: bash
        run: |
          set -euo pipefail

          PORT=3333
          EXPORT="$RECOVERED/WatchDogs2Mobile"
          mkdir -p "$EXPORT"

          "$RIPPER" \
            --headless \
            --port "$PORT" \
            > "$OUTPUT/assetripper.log" 2>&1 &

          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT

          READY=0
          for i in $(seq 1 120); do
            if curl -fsS "http://127.0.0.1:${PORT}/" >/dev/null 2>&1; then
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            tail -300 "$OUTPUT/assetripper.log" || true
            exit 1
          fi

          LOAD_CODE="$(
            curl -sS \
              -o "$OUTPUT/assetripper-load-response.txt" \
              -w '%{http_code}' \
              -H 'Content-Type: application/x-www-form-urlencoded' \
              --data-urlencode "Path=$APKROOT" \
              "http://127.0.0.1:${PORT}/LoadFolder"
          )"

          if [ "$LOAD_CODE" != "200" ] && [ "$LOAD_CODE" != "302" ]; then
            cat "$OUTPUT/assetripper-load-response.txt" || true
            exit 1
          fi

          EXPORT_CODE="$(
            curl -sS \
              -o "$OUTPUT/assetripper-export-response.txt" \
              -w '%{http_code}' \
              -H 'Content-Type: application/x-www-form-urlencoded' \
              --data-urlencode "Path=$EXPORT" \
              --data-urlencode 'CreateSubfolder=false' \
              "http://127.0.0.1:${PORT}/Export/UnityProject"
          )"

          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true
          trap - EXIT

          if [ "$EXPORT_CODE" != "200" ] && [ "$EXPORT_CODE" != "302" ]; then
            cat "$OUTPUT/assetripper-export-response.txt" || true
            tail -500 "$OUTPUT/assetripper.log" || true
            exit 1
          fi

          PROJECT=""

          if [ -d "$EXPORT/ExportedProject/Assets" ]; then
            PROJECT="$EXPORT/ExportedProject"
          elif [ -d "$EXPORT/Assets" ]; then
            PROJECT="$EXPORT"
          else
            PROJECT="$(
              find "$EXPORT" -type d -name Assets -print \
                | head -1 \
                | xargs -r dirname
            )"
          fi

          test -n "$PROJECT"
          test -d "$PROJECT/Assets"

          PROJECT="$(realpath "$PROJECT")"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

          {
            echo "RECOVERED_PROJECT=$PROJECT"
            echo "SCENES=$(find "$PROJECT/Assets" -type f -name '*.unity' | wc -l | tr -d ' ')"
            echo "CS_FILES=$(find "$PROJECT/Assets" -type f -name '*.cs' | wc -l | tr -d ' ')"
            echo "SHADERS=$(find "$PROJECT/Assets" -type f -name '*.shader' | wc -l | tr -d ' ')"
            echo
            echo "SCENES:"
            find "$PROJECT/Assets" -type f -name '*.unity' | sort
          } | tee "$OUTPUT/recovery-summary.txt"

      - name: Prepare recovered 5.6 project for 2017 migration
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.recover.outputs.project }}"

          find "$PROJECT/Assets" -type f \
            \( -iname '*.so' -o -iname '*.aar' -o -iname '*.jar' -o -iname '*.apk' \) \
            -print \
            | tee "$OUTPUT/removed-android-files.txt" || true

          find "$PROJECT/Assets" -type f \
            \( -iname '*.so' -o -iname '*.aar' -o -iname '*.jar' -o -iname '*.apk' \) \
            -delete || true

          rm -rf "$PROJECT/Assets/Plugins/Android" || true

          python3 - <<'PY'
          import os
          import shutil
          from pathlib import Path

          project = Path(os.environ["PROJECT"])
          names = {
              "UnityEngine.dll",
              "UnityEngine.UI.dll",
              "UnityEngine.Networking.dll",
              "mscorlib.dll",
              "System.dll",
              "System.Core.dll",
              "Mono.Security.dll",
          }

          moved = project.parent / "removed-runtime-dlls-v1.4"
          moved.mkdir(parents=True, exist_ok=True)

          for p in list((project / "Assets").rglob("*.dll")):
              if p.name not in names:
                  continue

              rel = p.relative_to(project / "Assets")
              dst = moved / rel
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.move(str(p), str(dst))

              meta = Path(str(p) + ".meta")
              if meta.exists():
                  shutil.move(str(meta), str(dst) + ".meta")

              print("moved", rel)
          PY

          mkdir -p "$PROJECT/Assets/WatchDogs2iOS/Editor"
          cp "$OUTPUT/Watch-Dogs-2-Mobile-original-icon.png" \
            "$PROJECT/Assets/WatchDogs2iOS/app_icon.png"

          cat > "$PROJECT/ProjectSettings/ProjectVersion.txt" <<EOF
          m_EditorVersion: $MIGRATION_UNITY
          m_EditorVersionWithRevision: $MIGRATION_UNITY ($MIGRATION_CHANGESET)
          EOF

          rm -rf "$PROJECT/Packages" || true

      - name: Check Unity credentials
        shell: bash
        run: |
          set -euo pipefail

          test -n "${UNITY_USERNAME:-}" || {
            echo "::error::UNITY_USERNAME repository secret is missing."
            exit 1
          }

          test -n "${UNITY_PASSWORD:-}" || {
            echo "::error::UNITY_PASSWORD repository secret is missing."
            exit 1
          }

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Unity Hub and activation helper
        shell: bash
        run: |
          set -euo pipefail

          npm install -g @rage-against-the-pixel/unity-cli

          sudo install -d -m 0755 /etc/apt/keyrings

          curl -fsSL https://hub.unity3d.com/linux/keys/public \
            | sudo gpg --dearmor \
              -o /etc/apt/keyrings/unityhub.gpg

          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/unityhub.gpg] https://hub.unity3d.com/linux/repos/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/unityhub.list >/dev/null

          sudo apt-get update -o Acquire::Retries=4 || true
          sudo apt-get install -y unityhub

          HUB_CMD="$(command -v unityhub)"

          sudo mkdir -p /opt/unityhub
          sudo tee /opt/unityhub/unityhub >/dev/null <<EOF
          #!/bin/bash
          exec xvfb-run -a "$HUB_CMD" --no-sandbox --headless "\$@"
          EOF
          sudo chmod +x /opt/unityhub/unityhub

      - name: Install official Unity CLI
        shell: bash
        run: |
          set -euo pipefail

          export UNITY_CLI_HOME="$WORK/tools/unity-official-cli"
          export UNITY_CLI_CHANNEL="beta"
          export UNITY_NON_INTERACTIVE=1
          export UNITY_NO_CONSENT_PROMPT=1
          export UNITY_NO_UPDATE_CHECK=1

          mkdir -p "$UNITY_CLI_HOME"

          curl -fsSL --retry 5 --retry-delay 3 \
            https://public-cdn.cloud.unity3d.com/hub/prod/cli/install.sh \
            -o "$WORK/unity-cli-install.sh"

          bash "$WORK/unity-cli-install.sh"

          OFFICIAL="$UNITY_CLI_HOME/bin/unity"
          test -x "$OFFICIAL"

          echo "OFFICIAL_UNITY_CLI=$OFFICIAL" >> "$GITHUB_ENV"
          "$OFFICIAL" --version

      - name: Install Unity 2019.4.40f1 and iOS support
        shell: bash
        run: |
          set -euo pipefail

          INSTALL_ROOT="$HOME/UnityEditors"
          mkdir -p "$INSTALL_ROOT"

          export UNITY_NON_INTERACTIVE=1
          export UNITY_NO_CONSENT_PROMPT=1
          export UNITY_NO_UPDATE_CHECK=1
          export UNITY_INSTALL_RETRIES=3

          "$OFFICIAL_UNITY_CLI" \
            --non-interactive \
            --no-banner \
            --no-color \
            editors install-path --set "$INSTALL_ROOT"

          timeout 80m "$OFFICIAL_UNITY_CLI" \
            --non-interactive \
            --no-banner \
            --no-color \
            install "$BUILD_UNITY" \
            --changeset "$BUILD_CHANGESET" \
            --module ios \
            --no-child-modules \
            --yes \
            --accept-eula \
            2>&1 | tee "$OUTPUT/unity-2019-install.log"

          UNITY2019="$(
            find "$INSTALL_ROOT" \
              -type f \
              -path '*/Editor/Unity' \
              -perm -111 \
              -print \
              | grep '2019.4.40f1' \
              | head -1
          )"

          if [ -z "${UNITY2019:-}" ]; then
            UNITY2019="$(
              find "$INSTALL_ROOT" \
                -type f \
                -path '*/Editor/Unity' \
                -perm -111 \
                -print \
                | head -1
            )"
          fi

          test -n "$UNITY2019"
          echo "UNITY2019=$UNITY2019" >> "$GITHUB_ENV"

      - name: Activate Unity Personal
        shell: bash
        run: |
          set -euo pipefail

          CLIENT="$(
            find /usr /opt "$HOME" \
              -type f \
              -name 'Unity.Licensing.Client' \
              2>/dev/null \
              | head -1
          )"

          if [ -n "${CLIENT:-}" ]; then
            CLIENT_DIR="$(dirname "$CLIENT")"
            sudo rm -rf /opt/unityhub/UnityLicensingClient
            sudo mkdir -p /opt/unityhub/UnityLicensingClient
            sudo cp -a "$CLIENT_DIR"/. /opt/unityhub/UnityLicensingClient/
            sudo chmod +x /opt/unityhub/UnityLicensingClient/Unity.Licensing.Client || true
          fi

          GLOBAL_NODE_MODULES="$(npm root -g)"
          LICENSE_MODULE="$GLOBAL_NODE_MODULES/@rage-against-the-pixel/unity-cli/dist/license-client.js"

          test -f "$LICENSE_MODULE"
          export LICENSE_MODULE

          node <<'NODE'
          const { LicensingClient, LicenseType } = require(process.env.LICENSE_MODULE);

          async function main() {
            const client = new LicensingClient('6.x');
            await client.Activate(
              {
                licenseType: LicenseType.personal,
                username: process.env.UNITY_USERNAME,
                password: process.env.UNITY_PASSWORD
              },
              true
            );
            console.log("UNITY PERSONAL ACTIVATION: SUCCESS");
          }

          main().catch((e) => {
            console.error(e && e.stack ? e.stack : e);
            process.exit(1);
          });
          NODE

      - name: Install Unity 2017.4.40f1
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$WORK/unity-2017"

          URL="https://download.unity3d.com/download_unity/${MIGRATION_CHANGESET}/LinuxEditorInstaller/Unity-${MIGRATION_UNITY}.tar.xz"

          curl -fL \
            --retry 5 \
            --retry-delay 5 \
            "$URL" \
            -o "$WORK/Unity-${MIGRATION_UNITY}.tar.xz"

          tar -xJf "$WORK/Unity-${MIGRATION_UNITY}.tar.xz" \
            -C "$WORK/unity-2017"

          UNITY2017="$(
            find "$WORK/unity-2017" \
              -type f \
              -path '*/Editor/Unity' \
              -perm -111 \
              -print \
              | head -1
          )"

          test -n "$UNITY2017"
          echo "UNITY2017=$UNITY2017" >> "$GITHUB_ENV"

      - name: Unity 2017 compatibility migration
        shell: bash
        run: |
          set +e

          PROJECT="${{ steps.recover.outputs.project }}"
          LOG="$OUTPUT/unity-2017-migration.log"

          rm -rf \
            "$PROJECT/Library/ScriptAssemblies" \
            "$PROJECT/Temp" \
            "$PROJECT/obj" \
            2>/dev/null || true

          timeout 75m xvfb-run -a "$UNITY2017" \
            -batchmode \
            -nographics \
            -quit \
            -projectPath "$PROJECT" \
            -logFile "$LOG"

          RC=$?
          echo "UNITY2017_EXIT_CODE=$RC" | tee "$OUTPUT/unity-2017-exit-code.txt"

          if grep -qE 'error CS[0-9]+|Scripts have compiler errors|Compilation failed' "$LOG"; then
            grep -nEi -A 15 -B 8 \
              'error CS[0-9]+|Scripts have compiler errors|Compilation failed' \
              "$LOG" \
              | tail -1000
            exit 1
          fi

          exit 0

      - name: Prepare migrated project for Unity 2019 iOS
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.recover.outputs.project }}"

          mkdir -p "$PROJECT/Packages"

          cat > "$PROJECT/Packages/manifest.json" <<'JSON'
          {
            "dependencies": {
              "com.unity.ugui": "1.0.0",
              "com.unity.modules.ai": "1.0.0",
              "com.unity.modules.animation": "1.0.0",
              "com.unity.modules.assetbundle": "1.0.0",
              "com.unity.modules.audio": "1.0.0",
              "com.unity.modules.cloth": "1.0.0",
              "com.unity.modules.director": "1.0.0",
              "com.unity.modules.imageconversion": "1.0.0",
              "com.unity.modules.imgui": "1.0.0",
              "com.unity.modules.jsonserialize": "1.0.0",
              "com.unity.modules.particlesystem": "1.0.0",
              "com.unity.modules.physics": "1.0.0",
              "com.unity.modules.physics2d": "1.0.0",
              "com.unity.modules.screencapture": "1.0.0",
              "com.unity.modules.terrain": "1.0.0",
              "com.unity.modules.terrainphysics": "1.0.0",
              "com.unity.modules.tilemap": "1.0.0",
              "com.unity.modules.ui": "1.0.0",
              "com.unity.modules.uielements": "1.0.0",
              "com.unity.modules.umbra": "1.0.0",
              "com.unity.modules.unityanalytics": "1.0.0",
              "com.unity.modules.unitywebrequest": "1.0.0",
              "com.unity.modules.unitywebrequestassetbundle": "1.0.0",
              "com.unity.modules.unitywebrequestaudio": "1.0.0",
              "com.unity.modules.unitywebrequesttexture": "1.0.0",
              "com.unity.modules.unitywebrequestwww": "1.0.0",
              "com.unity.modules.vehicles": "1.0.0",
              "com.unity.modules.video": "1.0.0",
              "com.unity.modules.vr": "1.0.0",
              "com.unity.modules.wind": "1.0.0",
              "com.unity.modules.xr": "1.0.0"
            }
          }
          JSON

          rm -f "$PROJECT/Packages/packages-lock.json" || true

          cat > "$PROJECT/ProjectSettings/ProjectVersion.txt" <<EOF
          m_EditorVersion: $BUILD_UNITY
          m_EditorVersionWithRevision: $BUILD_UNITY ($BUILD_CHANGESET)
          EOF

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          project = Path(os.environ["PROJECT"])
          assets = project / "Assets"
          changed = []

          for p in assets.rglob("*.cs"):
              s = p.read_text(encoding="utf-8", errors="replace")
              old = s

              s = re.sub(r'^\s*using\s+UnityScript(?:\.[A-Za-z_][A-Za-z0-9_.]*)?\s*;\s*$', '', s, flags=re.M)
              s = re.sub(r'^\s*using\s+UnityEngine\.Android\s*;\s*$', '', s, flags=re.M)

              s = re.sub(r'\bGUIText\b', 'UnityEngine.UI.Text', s)
              s = re.sub(r'\bGUITexture\b', 'UnityEngine.UI.RawImage', s)

              s = s.replace('Graphics.DrawProceduralIndirect(', 'Graphics.DrawProceduralIndirectNow(')
              s = s.replace('ComputeBufferType.DrawIndirect', 'ComputeBufferType.IndirectArguments')

              s = s.replace('Application.LoadLevelAsync(', 'UnityEngine.SceneManagement.SceneManager.LoadSceneAsync(')
              s = s.replace('Application.LoadLevel(', 'UnityEngine.SceneManagement.SceneManager.LoadScene(')
              s = s.replace('Application.loadedLevelName', 'UnityEngine.SceneManagement.SceneManager.GetActiveScene().name')
              s = s.replace('Application.loadedLevel', 'UnityEngine.SceneManagement.SceneManager.GetActiveScene().buildIndex')

              if p.name in {"SunShafts.cs", "BloomAndFlares.cs", "Bloom.cs"}:
                  s = re.sub(r'\.hdr\b', '.allowHDR', s)

              if p.name in {"RCC_CameraConfig.cs", "RCC_GetBounds.cs"}:
                  s = re.sub(r'\bParticleRenderer\b', 'ParticleSystemRenderer', s)

              if re.search(r'^\s*using\s+System\.Diagnostics\s*;', s, flags=re.M):
                  s = re.sub(r'(?<![\w.])Debug\.', 'UnityEngine.Debug.', s)

              if s != old:
                  p.write_text(s, encoding="utf-8")
                  changed.append(str(p.relative_to(project)))

          out = Path(os.environ["OUTPUT"]) / "legacy-api-patched-v1.4.txt"
          out.write_text("\n".join(changed) + ("\n" if changed else ""), encoding="utf-8")
          print("Patched files:", len(changed))
          PY

          cat > "$PROJECT/Assets/WatchDogs2iOS/UnityScriptExtensionsCompatibility.cs" <<'CS'
          using System;
          using System.Collections;

          public static class Extensions
          {
              public static int get_length(Array value)
              {
                  return value == null ? 0 : value.Length;
              }

              public static int get_length(string value)
              {
                  return value == null ? 0 : value.Length;
              }

              public static int get_length(ICollection value)
              {
                  return value == null ? 0 : value.Count;
              }

              public static int get_length(object value)
              {
                  if (value == null) return 0;
                  Array a = value as Array;
                  if (a != null) return a.Length;
                  string s = value as string;
                  if (s != null) return s.Length;
                  ICollection c = value as ICollection;
                  if (c != null) return c.Count;
                  return 0;
              }
          }
          CS

          cat > "$PROJECT/Assets/WatchDogs2iOS/WatchDogs2IOSRuntimeLogger.cs" <<'CS'
          using System;
          using System.IO;
          using UnityEngine;
          using UnityEngine.SceneManagement;

          public sealed class WatchDogs2IOSRuntimeLogger : MonoBehaviour
          {
              private string logPath;

              [RuntimeInitializeOnLoadMethod(RuntimeInitializeLoadType.BeforeSceneLoad)]
              private static void Install()
              {
                  if (FindObjectOfType<WatchDogs2IOSRuntimeLogger>() != null)
                      return;

                  var go = new GameObject("WD2-iOS-Stability");
                  DontDestroyOnLoad(go);
                  go.AddComponent<WatchDogs2IOSRuntimeLogger>();
              }

              private void Awake()
              {
                  logPath = System.IO.Path.Combine(
                      Application.persistentDataPath,
                      "watch-dogs-2-ios-runtime.log"
                  );

                  Screen.sleepTimeout = SleepTimeout.NeverSleep;
                  Input.multiTouchEnabled = true;
                  QualitySettings.vSyncCount = 0;
                  Application.targetFrameRate = 60;

                  Application.logMessageReceived += OnLog;
                  Application.lowMemory += OnLowMemory;
                  SceneManager.sceneLoaded += OnSceneLoaded;

                  Write(
                      "START Unity=" + Application.unityVersion +
                      " GPU=" + SystemInfo.graphicsDeviceName +
                      " Graphics=" + SystemInfo.graphicsDeviceVersion
                  );
              }

              private void OnDestroy()
              {
                  Application.logMessageReceived -= OnLog;
                  Application.lowMemory -= OnLowMemory;
                  SceneManager.sceneLoaded -= OnSceneLoaded;
              }

              private void OnLowMemory()
              {
                  Resources.UnloadUnusedAssets();
              }

              private void OnSceneLoaded(Scene scene, LoadSceneMode mode)
              {
                  Write("SCENE_LOADED " + scene.name);
              }

              private void OnLog(string condition, string stackTrace, LogType type)
              {
                  if (type == LogType.Log)
                      return;

                  Write("[" + type + "] " + condition + "\n" + stackTrace);
              }

              private void Write(string message)
              {
                  try
                  {
                      File.AppendAllText(
                          logPath,
                          "[" + DateTime.UtcNow.ToString("O") + "] " + message + "\n"
                      );
                  }
                  catch {}
              }
          }
          CS

          cat > "$PROJECT/Assets/WatchDogs2iOS/Editor/WatchDogs2IOSBuild.cs" <<'CS'
          using System;
          using System.IO;
          using System.Linq;
          using System.Collections.Generic;

          using UnityEditor;
          using UnityEditor.Build.Reporting;

          using UnityEngine;
          using UnityEngine.Rendering;

          public static class WatchDogs2IOSBuild
          {
              public static void PerformBuild()
              {
                  string output = Environment.GetEnvironmentVariable("WD2_IOS_XCODE_PATH");

                  if (String.IsNullOrEmpty(output))
                      throw new Exception("WD2_IOS_XCODE_PATH is missing.");

                  Directory.CreateDirectory(output);

                  EditorUserBuildSettings.SwitchActiveBuildTarget(
                      BuildTargetGroup.iOS,
                      BuildTarget.iOS
                  );

                  PlayerSettings.companyName = "Watch Dogs 2 Mobile Port";
                  PlayerSettings.productName = "Watch Dogs 2 Mobile";
                  PlayerSettings.bundleVersion = "1.4";

                  PlayerSettings.SetApplicationIdentifier(
                      BuildTargetGroup.iOS,
                      "com.negel.watchdogs2mobile"
                  );

                  PlayerSettings.SetScriptingBackend(
                      BuildTargetGroup.iOS,
                      ScriptingImplementation.IL2CPP
                  );

                  PlayerSettings.SetApiCompatibilityLevel(
                      BuildTargetGroup.iOS,
                      ApiCompatibilityLevel.NET_4_6
                  );

                  PlayerSettings.iOS.targetOSVersionString = "12.0";
                  PlayerSettings.iOS.sdkVersion = iOSSdkVersion.DeviceSDK;
                  PlayerSettings.iOS.appleEnableAutomaticSigning = false;

                  PlayerSettings.stripEngineCode = false;
                  PlayerSettings.SetManagedStrippingLevel(
                      BuildTargetGroup.iOS,
                      ManagedStrippingLevel.Disabled
                  );

                  PlayerSettings.colorSpace = ColorSpace.Gamma;
                  PlayerSettings.defaultInterfaceOrientation = UIOrientation.LandscapeLeft;
                  PlayerSettings.allowedAutorotateToPortrait = false;
                  PlayerSettings.allowedAutorotateToPortraitUpsideDown = false;
                  PlayerSettings.allowedAutorotateToLandscapeLeft = true;
                  PlayerSettings.allowedAutorotateToLandscapeRight = true;

                  PlayerSettings.SetUseDefaultGraphicsAPIs(BuildTarget.iOS, false);
                  PlayerSettings.SetGraphicsAPIs(
                      BuildTarget.iOS,
                      new[] { GraphicsDeviceType.Metal }
                  );

                  ApplyOriginalIcon();

                  string[] allScenes = AssetDatabase.FindAssets("t:Scene")
                      .Select(AssetDatabase.GUIDToAssetPath)
                      .Where(p => p.EndsWith(".unity", StringComparison.OrdinalIgnoreCase))
                      .Distinct()
                      .ToArray();

                  if (allScenes.Length == 0)
                      throw new Exception("No recovered Unity scenes were found.");

                  string[] preferred = { "Home", "GamePlay" };
                  var ordered = new List<string>();

                  foreach (string wanted in preferred)
                  {
                      string match = allScenes.FirstOrDefault(
                          p => System.IO.Path.GetFileNameWithoutExtension(p)
                              .Equals(wanted, StringComparison.OrdinalIgnoreCase)
                      );

                      if (!String.IsNullOrEmpty(match) && !ordered.Contains(match))
                          ordered.Add(match);
                  }

                  foreach (string scene in allScenes.OrderBy(x => x))
                  {
                      if (!ordered.Contains(scene))
                          ordered.Add(scene);
                  }

                  Debug.Log("===== WATCH DOGS 2 MOBILE SCENES =====");
                  foreach (string s in ordered)
                      Debug.Log(s);

                  var options = new BuildPlayerOptions
                  {
                      scenes = ordered.ToArray(),
                      locationPathName = output,
                      target = BuildTarget.iOS,
                      options = BuildOptions.None
                  };

                  BuildReport report = BuildPipeline.BuildPlayer(options);
                  BuildSummary summary = report.summary;

                  Debug.Log("Watch Dogs 2 iOS build result: " + summary.result);
                  Debug.Log("Errors=" + summary.totalErrors);
                  Debug.Log("Warnings=" + summary.totalWarnings);
                  Debug.Log("Output=" + summary.outputPath);

                  if (summary.result != BuildResult.Succeeded)
                      throw new Exception("iOS Xcode export failed: " + summary.result);
              }

              private static void ApplyOriginalIcon()
              {
                  const string iconPath = "Assets/WatchDogs2iOS/app_icon.png";

                  AssetDatabase.ImportAsset(
                      iconPath,
                      ImportAssetOptions.ForceSynchronousImport |
                      ImportAssetOptions.ForceUpdate
                  );

                  var importer = AssetImporter.GetAtPath(iconPath) as TextureImporter;

                  if (importer != null)
                  {
                      importer.textureType = TextureImporterType.Default;
                      importer.alphaIsTransparency = true;
                      importer.mipmapEnabled = false;
                      importer.textureCompression = TextureImporterCompression.Uncompressed;
                      importer.SaveAndReimport();
                  }

                  Texture2D icon = AssetDatabase.LoadAssetAtPath<Texture2D>(iconPath);
                  if (icon == null) return;

                  int[] sizes = PlayerSettings.GetIconSizesForTargetGroup(BuildTargetGroup.iOS);
                  Texture2D[] icons = new Texture2D[sizes.Length];

                  for (int i = 0; i < icons.Length; i++)
                      icons[i] = icon;

                  PlayerSettings.SetIconsForTargetGroup(BuildTargetGroup.iOS, icons);
              }
          }
          CS

          echo "===== SHADER AUDIT ====="

          DUMMY_COUNT="$(grep -RIl --include='*.shader' 'DummyShaderTextExporter' "$PROJECT/Assets" 2>/dev/null | wc -l | tr -d ' ')"
          SHADER_COUNT="$(find "$PROJECT/Assets" -type f -name '*.shader' | wc -l | tr -d ' ')"

          {
            echo "SHADERS=$SHADER_COUNT"
            echo "DUMMY_SHADERS=$DUMMY_COUNT"
            echo
            grep -RIl --include='*.shader' 'DummyShaderTextExporter' "$PROJECT/Assets" 2>/dev/null || true
          } | tee "$OUTPUT/shader-audit-v1.4.txt"

          if [ "$DUMMY_COUNT" -gt 0 ]; then
            echo "::warning::AssetRipper exported $DUMMY_COUNT dummy shader(s). The IPA may build but graphics can still be wrong, like NFS."
          fi

      - name: Unity 2019 warm-up import and API repair
        shell: bash
        run: |
          set +e

          PROJECT="${{ steps.recover.outputs.project }}"
          LOG="$OUTPUT/unity-2019-warmup.log"

          rm -rf "$PROJECT/Library" "$PROJECT/Temp" "$PROJECT/obj" 2>/dev/null || true

          timeout 75m xvfb-run -a "$UNITY2019" \
            -batchmode \
            -nographics \
            -quit \
            -accept-apiupdate \
            -projectPath "$PROJECT" \
            -buildTarget iOS \
            -logFile "$LOG"

          RC=$?
          echo "UNITY2019_WARMUP_EXIT_CODE=$RC" | tee "$OUTPUT/unity-2019-warmup-exit-code.txt"

          echo "===== WARM-UP IMPORTANT ERRORS ====="
          grep -nEi -A 15 -B 8 \
            'error CS[0-9]+|Compilation failed|compiler error|Exception|failed' \
            "$LOG" \
            | tail -800 || true

          rm -rf "$PROJECT/Library/ScriptAssemblies" "$PROJECT/Temp" "$PROJECT/obj" 2>/dev/null || true

          exit 0

      - name: Final compile audit
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.recover.outputs.project }}"

          if grep -RIn --include='*.cs' -E '^[[:space:]]*using[[:space:]]+UnityScript' "$PROJECT/Assets"; then
            echo "::error::UnityScript using directive remains."
            exit 1
          fi

          if grep -RIn --include='*.cs' 'Graphics\.DrawProceduralIndirect(' "$PROJECT/Assets"; then
            echo "::error::Old DrawProceduralIndirect API remains."
            exit 1
          fi

          for FILE in SunShafts.cs BloomAndFlares.cs Bloom.cs; do
            if find "$PROJECT/Assets" -name "$FILE" -type f -print0 \
              | xargs -0 -r grep -nE '\.hdr\b'; then
              echo "::error::Old Camera.hdr remains in $FILE"
              exit 1
            fi
          done

          echo "v1.4 compile audit: CLEAN"

      - name: Build Watch Dogs 2 iOS Xcode project
        id: unity_build
        shell: bash
        env:
          WD2_IOS_XCODE_PATH: ${{ github.workspace }}/wd2-build/iOS/WatchDogs2Mobile-iOS
        run: |
          set +e

          PROJECT="${{ steps.recover.outputs.project }}"
          LOG="$OUTPUT/unity-2019-ios-build.log"

          timeout 100m xvfb-run -a "$UNITY2019" \
            -batchmode \
            -nographics \
            -quit \
            -accept-apiupdate \
            -projectPath "$PROJECT" \
            -buildTarget iOS \
            -executeMethod WatchDogs2IOSBuild.PerformBuild \
            -logFile "$LOG"

          RC=$?
          echo "UNITY2019_EXIT_CODE=$RC" | tee "$OUTPUT/unity-2019-exit-code.txt"

          echo "===== UNITY LOG TAIL ====="
          tail -500 "$LOG" || true

          echo "===== IMPORTANT UNITY ERRORS ====="
          grep -nEi -A 25 -B 8 \
            'error CS[0-9]+|Compilation failed|compiler error|Exception|Error building Player|BuildFailedException|DllNotFoundException|TypeLoadException|MissingReferenceException|Fatal error|failed' \
            "$LOG" \
            | tail -700 || true

          exit "$RC"

      - name: Detect Xcode project
        id: detect_xcode
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          READY=false

          if [ -d "$XCODE_OUT" ] && \
             find "$XCODE_OUT" -maxdepth 3 \
               \( -name '*.xcodeproj' -o -name '*.xcworkspace' \) \
               | grep -q .
          then
            READY=true
          fi

          echo "ready=$READY" >> "$GITHUB_OUTPUT"
          echo "XCODE_READY=$READY"

      - name: Pack Xcode project
        if: steps.detect_xcode.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail

          tar -C "$(dirname "$XCODE_OUT")" \
            -czf "$GITHUB_WORKSPACE/Watch-Dogs-2-Mobile-iOS-v1.4-Xcode.tar.gz" \
            "$(basename "$XCODE_OUT")"

          ls -lh "$GITHUB_WORKSPACE/Watch-Dogs-2-Mobile-iOS-v1.4-Xcode.tar.gz"

      - name: Collect Unity diagnostics
        if: always()
        shell: bash
        run: |
          set +e

          DIAG="$GITHUB_WORKSPACE/Watch-Dogs-2-Mobile-iOS-v1.4-Diagnostics"
          rm -rf "$DIAG"
          mkdir -p "$DIAG"

          cp "$OUTPUT/apk-summary.txt" "$DIAG/" 2>/dev/null || true
          cp "$OUTPUT/recovery-summary.txt" "$DIAG/" 2>/dev/null || true
          cp "$OUTPUT/assetripper.log" "$DIAG/" 2>/dev/null || true
          cp "$OUTPUT/unity-2017-migration.log" "$DIAG/" 2>/dev/null || true
          cp "$OUTPUT/unity-2019-install.log" "$DIAG/" 2>/dev/null || true
          cp "$OUTPUT/unity-2019-warmup.log" "$DIAG/" 2>/dev/null || true
          cp "$OUTPUT/unity-2019-ios-build.log" "$DIAG/" 2>/dev/null || true
          cp "$OUTPUT/legacy-api-patched-v1.4.txt" "$DIAG/" 2>/dev/null || true
          cp "$OUTPUT/shader-audit-v1.4.txt" "$DIAG/" 2>/dev/null || true
          cp "$OUTPUT/Watch-Dogs-2-Mobile-original-icon.png" "$DIAG/" 2>/dev/null || true

          if [ -n "${PROJECT:-}" ] && [ -f "$PROJECT/ProjectSettings/ProjectVersion.txt" ]; then
            cp "$PROJECT/ProjectSettings/ProjectVersion.txt" "$DIAG/" || true
          fi

          {
            echo "SOURCE_UNITY=$SOURCE_UNITY"
            echo "MIGRATION_UNITY=$MIGRATION_UNITY"
            echo "BUILD_UNITY=$BUILD_UNITY"
            echo "XCODE_READY=${{ steps.detect_xcode.outputs.ready }}"
          } > "$DIAG/summary.txt"

          grep -RniE \
            'error CS[0-9]+|Compilation failed|compiler error|Exception|failed|failure|unsupported|DllNotFoundException|TypeLoadException|MissingReferenceException|BuildFailedException' \
            "$DIAG" \
            > "$DIAG/important-errors.txt" \
            2>/dev/null || true

          zip -qr \
            "$GITHUB_WORKSPACE/Watch-Dogs-2-Mobile-iOS-v1.4-Diagnostics.zip" \
            "$DIAG"

      - name: Upload Unity diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Watch-Dogs-2-Mobile-iOS-v1.4-Diagnostics
          path: Watch-Dogs-2-Mobile-iOS-v1.4-Diagnostics.zip
          compression-level: 0
          if-no-files-found: warn

      - name: Upload Xcode project
        if: steps.detect_xcode.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Watch-Dogs-2-Mobile-iOS-v1.4-Xcode
          path: Watch-Dogs-2-Mobile-iOS-v1.4-Xcode.tar.gz
          compression-level: 0
          if-no-files-found: error

      - name: Fail clearly if Unity did not export Xcode
        if: steps.detect_xcode.outputs.ready != 'true'
        shell: bash
        run: |
          echo "::error::Unity did not generate the Watch Dogs 2 Mobile Xcode project."
          exit 1

  xcode_build:
    name: 2. Build unsigned IPA on macOS
    needs: recover_and_export
    if: needs.recover_and_export.outputs.xcode_ready == 'true'
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Download Xcode project
        uses: actions/download-artifact@v4
        with:
          name: Watch-Dogs-2-Mobile-iOS-v1.4-Xcode
          path: xcode-artifact

      - name: Extract Xcode project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p xcode

          tar -xzf \
            xcode-artifact/Watch-Dogs-2-Mobile-iOS-v1.4-Xcode.tar.gz \
            -C xcode

          find xcode -maxdepth 4 \
            \( -name '*.xcodeproj' -o -name '*.xcworkspace' \) \
            -print

      - name: Patch project for modern Xcode
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild -version

          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("xcode")
          changed = []

          for p in root.rglob("*"):
              if not p.is_file():
                  continue

              if not (p.name == "project.pbxproj" or p.suffix == ".xcconfig"):
                  continue

              try:
                  s = p.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue

              old = s
              s = s.replace("-mno-thumb", "")
              s = re.sub(
                  r'IPHONEOS_DEPLOYMENT_TARGET = [^;]+;',
                  'IPHONEOS_DEPLOYMENT_TARGET = 12.0;',
                  s
              )
              s = re.sub(
                  r'ENABLE_BITCODE = [^;]+;',
                  'ENABLE_BITCODE = NO;',
                  s
              )
              s = re.sub(
                  r'CODE_SIGN_STYLE = [^;]+;',
                  'CODE_SIGN_STYLE = Manual;',
                  s
              )

              if s != old:
                  p.write_text(s, encoding="utf-8")
                  changed.append(str(p))

          print("Patched Xcode files:", len(changed))
          for x in changed:
              print(x)
          PY

          if grep -RIn -- '-mno-thumb' xcode; then
            echo "::error::-mno-thumb still exists after patch."
            exit 1
          fi

      - name: Build unsigned app
        id: build_app
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail

          rm -rf DerivedData xcode-build.log

          WORKSPACE="$(
            find xcode -type d -name '*.xcworkspace' -print | head -1
          )"

          PROJECT="$(
            find xcode -type d -name '*.xcodeproj' -print | head -1
          )"

          if [ -n "${WORKSPACE:-}" ]; then
            LIST="$(xcodebuild -list -workspace "$WORKSPACE" 2>/dev/null || true)"
            echo "$LIST"
            SCHEME="Unity-iPhone"

            xcodebuild \
              -workspace "$WORKSPACE" \
              -scheme "$SCHEME" \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -derivedDataPath "$PWD/DerivedData" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              DEVELOPMENT_TEAM="" \
              ENABLE_BITCODE=NO \
              ONLY_ACTIVE_ARCH=NO \
              ARCHS=arm64 \
              IPHONEOS_DEPLOYMENT_TARGET=12.0 \
              build \
              2>&1 | tee xcode-build.log
          else
            test -n "$PROJECT"
            xcodebuild -list -project "$PROJECT" || true

            xcodebuild \
              -project "$PROJECT" \
              -scheme "Unity-iPhone" \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -derivedDataPath "$PWD/DerivedData" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              DEVELOPMENT_TEAM="" \
              ENABLE_BITCODE=NO \
              ONLY_ACTIVE_ARCH=NO \
              ARCHS=arm64 \
              IPHONEOS_DEPLOYMENT_TARGET=12.0 \
              build \
              2>&1 | tee xcode-build.log
          fi

          APP="$(
            find DerivedData/Build/Products \
              -type d \
              -path '*Release-iphoneos/*.app' \
              -print \
              | head -1
          )"

          if [ -z "${APP:-}" ] || [ ! -d "$APP" ]; then
            echo "::error::.app not found."
            exit 1
          fi

          echo "app=$APP" >> "$GITHUB_OUTPUT"
          du -sh "$APP"

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          APP="${{ steps.build_app.outputs.app }}"

          rm -rf Payload
          mkdir -p Payload
          cp -a "$APP" Payload/
          xattr -cr Payload || true

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            Payload \
            "Watch-Dogs-2-Mobile-iOS-v1.4-unsigned.ipa"

          ls -lh "Watch-Dogs-2-Mobile-iOS-v1.4-unsigned.ipa"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Watch-Dogs-2-Mobile-iOS-v1.4-unsigned-IPA
          path: Watch-Dogs-2-Mobile-iOS-v1.4-unsigned.ipa
          compression-level: 0
          if-no-files-found: error

      - name: Collect Xcode diagnostics
        if: failure()
        shell: bash
        run: |
          set +e

          rm -rf Watch-Dogs-2-Mobile-iOS-v1.4-Xcode-Diagnostics
          mkdir -p Watch-Dogs-2-Mobile-iOS-v1.4-Xcode-Diagnostics

          cp xcode-build.log \
            Watch-Dogs-2-Mobile-iOS-v1.4-Xcode-Diagnostics/ \
            2>/dev/null || true

          PBX="$(
            find xcode -type f -name project.pbxproj -print | head -1
          )"

          if [ -n "${PBX:-}" ]; then
            cp "$PBX" Watch-Dogs-2-Mobile-iOS-v1.4-Xcode-Diagnostics/ || true
          fi

          grep -nEi -A 20 -B 8 \
            'error:|fatal error|undefined symbol|ld:|clang:|failed|failure' \
            xcode-build.log \
            | tail -700 \
            > Watch-Dogs-2-Mobile-iOS-v1.4-Xcode-Diagnostics/important-errors.txt \
            2>/dev/null || true

      - name: Upload Xcode diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Watch-Dogs-2-Mobile-iOS-v1.4-Xcode-Diagnostics
          path: Watch-Dogs-2-Mobile-iOS-v1.4-Xcode-Diagnostics
          compression-level: 0
          if-no-files-found: warn
